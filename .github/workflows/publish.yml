name: Publier sur Instagram
on:
  schedule:
    - cron: "23 17 * * 1,3,5"   # Lun/Mer/Ven 19h23 Paris — heure décalée : les crons GitHub à heure pile sautent (loupés des 03/08)
  workflow_dispatch: {}

concurrency:
  group: sv-engine-git
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pynacl
      - run: python engine/publish.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          ASSET_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main
      - name: Photo du vrai feed Instagram (pour l'aperçu du Cockpit)
        continue-on-error: true
        run: python engine/feedsync.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: Archiver
        run: |
          git config user.name "sv-engine"
          git config user.email "engine@shadowvelora.com"
          git add queue engine
          git commit -m "publié $(date -u +%F)" || echo "rien à committer"
          ok=0
          for i in 1 2 3; do
            if git push; then ok=1; break; fi
            echo "push refuse (tentative $i) - rebase puis retry"
            git pull --rebase --autostash || true
            sleep $((i * 5))
          done
          [ "$ok" = "1" ] || { echo "::error::push impossible apres 3 tentatives (course git persistante)"; exit 1; }