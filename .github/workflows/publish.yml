name: Publier sur Instagram
on:
  schedule:
    - cron: "0 17 * * 1,3,5"   # lundi/mercredi/vendredi 17:00 UTC (~19h Paris)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python engine/publish.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          ASSET_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main
      - name: Archiver
        run: |
          git config user.name "sv-engine"
          git config user.email "engine@shadowvelora.com"
          git add queue
          git commit -m "publié $(date -u +%F)" || echo "rien à committer"
          git push
