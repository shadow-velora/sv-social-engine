name: Kit Story du dimanche
on:
  schedule:
    - cron: "0 8 * * 0"   # dimanche 08:00 UTC (10h Paris) — Laurie poste le soir
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - run: python engine/story.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
