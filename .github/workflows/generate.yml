name: Générer le lot hebdo
on:
  schedule:
    - cron: "0 6 * * 1"   # lundi 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install pillow
      - run: python engine/generate.py
      - name: Commit du lot
        run: |
          git config user.name "sv-engine"
          git config user.email "engine@shadowvelora.com"
          git add queue engine/state.json
          git commit -m "lot hebdo $(date -u +%F)" || echo "rien à committer"
          git push
