name: Générer le lot hebdo
on:
  schedule:
    - cron: "23 16 * * 0"   # dimanche 16:23 UTC (18h23 Paris) — généré la veille pour que le lundi matin soit TOUJOURS prêt même avec les retards GitHub (décision Laurie 10/08)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install pillow
      - run: python engine/generate_ai_lot.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
      - name: Commit du lot
        run: |
          git config user.name "sv-engine"
          git config user.email "engine@shadowvelora.com"
          git add queue engine/state.json
          git commit -m "lot hebdo $(date -u +%F)" || echo "rien à committer"
          git push
