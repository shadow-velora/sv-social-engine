name: Kit Réel du samedi
on:
  schedule:
    - cron: "0 7 * * 6"   # samedi 07:00 UTC (9h Paris) — Laurie valide et poste le soir
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - run: sudo apt-get -qq install -y ffmpeg
      - run: python engine/make_reel.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FFMPEG: ffmpeg
      - name: Archiver
        run: |
          git config user.name "sv-engine"
          git config user.email "engine@shadowvelora.com"
          git pull --rebase --autostash
          git add queue engine/state.json engine/budget.json
          git commit -m "kit réel $(date -u +%F)" || echo "rien"
          git push
