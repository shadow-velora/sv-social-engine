name: Kit Réel du samedi
on:
  # cron coupé le 03/08 — réels/kits week-end ARRÊTÉS sur ordre de Laurie. Relance manuelle seulement.
  workflow_dispatch: {}

concurrency:
  group: sv-engine-git
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - run: sudo apt-get -qq install -y ffmpeg
      - run: python engine/make_reel.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FFMPEG: ffmpeg
      - run: python engine/make_carousel_week.py || true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Archiver
        run: |
          git config user.name "sv-engine"
          git config user.email "engine@shadowvelora.com"
          git pull --rebase --autostash
          git add queue engine/state.json engine/budget.json
          git commit -m "kit réel $(date -u +%F)" || echo "rien"
          ok=0
          for i in 1 2 3; do
            if git push; then ok=1; break; fi
            echo "push refuse (tentative $i) - rebase puis retry"
            git pull --rebase --autostash || true
            sleep $((i * 5))
          done
          [ "$ok" = "1" ] || { echo "::error::push impossible apres 3 tentatives (course git persistante)"; exit 1; }