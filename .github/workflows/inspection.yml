name: Inspection quotidienne
on:
  schedule:
    - cron: "37 6 * * *"    # tous les jours 06:37 UTC (8h37 Paris) — heure décalée anti-saut
    - cron: "47 18 * * 1,3,5"  # 20h47 Paris les soirs de publication : rattrape un cron publish sauté
  workflow_dispatch: {}

concurrency:
  group: sv-engine-git
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  inspection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - run: python engine/inspectrice.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
      - name: Photo du vrai feed Instagram (pour l'aperçu du Cockpit)
        continue-on-error: true
        run: python engine/feedsync.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: Archiver
        run: |
          git config user.name "sv-engine"
          git config user.email "engine@shadowvelora.com"
          git pull --rebase --autostash
          git add queue engine
          git commit -m "inspection $(date -u +%F)" || echo "rien"
          ok=0
          for i in 1 2 3; do
            if git push; then ok=1; break; fi
            echo "push refuse (tentative $i) - rebase puis retry"
            git pull --rebase --autostash || true
            sleep $((i * 5))
          done
          [ "$ok" = "1" ] || { echo "::error::push impossible apres 3 tentatives (course git persistante)"; exit 1; }